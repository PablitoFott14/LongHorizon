<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LongHorizon Persona Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>LongHorizon Persona Visualizer</h1>
      <p>Single-source mapping from all service JSON files.</p>
    </header>

    <section class="summary" id="summary">
      <div class="metric">
        <span class="metric-label">Personas</span>
        <strong id="metric-personas">0</strong>
      </div>
      <div class="metric">
        <span class="metric-label">Services</span>
        <strong id="metric-services">0</strong>
      </div>
      <div class="metric">
        <span class="metric-label">Mapped Records</span>
        <strong id="metric-mapped">0</strong>
      </div>
      <div class="metric">
        <span class="metric-label">Unmapped Records</span>
        <strong id="metric-unmapped">0</strong>
      </div>
    </section>

    <section>
      <h2>All Personas</h2>
      <div id="personas-root" class="persona-list"></div>
    </section>

    <section>
      <h2>Unmapped Data</h2>
      <p class="section-note">Records that cannot be linked to a specific persona with strict ID-based mapping.</p>
      <div id="unmapped-root" class="unmapped-list"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
