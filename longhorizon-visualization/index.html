<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LongHorizon — OpenClaw Universe</title>
  <link rel="stylesheet" href="css/style.css?v=20260501-chart-details" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">LH</div>
        <div class="brand-name">
          <span>LongHorizon</span>
          <small>OpenClaw Universe</small>
        </div>
      </div>
      <div class="hdr-right">
        <span class="pulse-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Loading…</span>
      </div>
    </div>
  </header>

  <main id="view" class="main"></main>

  <!-- Service detail modal -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-hdr">
        <div class="modal-hdr-left">
          <span id="modal-icon" class="modal-icon"></span>
          <div>
            <div id="modal-name" class="modal-name"></div>
            <div id="modal-persona" class="modal-persona"></div>
          </div>
        </div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loader-box">
      <div class="spinner"></div>
      <p id="load-msg">Loading universe…</p>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    </div>
  </div>

  <script src="js/app.js?v=20260501-chart-details"></script>
</body>
</html>
